<!DOCTYPE html>
<html>
<head>
    <title>VisionAid WebSocket Tester</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #log { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 5px; margin-top: 10px; background: #f9f9f9;}
        .controls { margin-top: 10px; }
        button { padding: 5px 15px; margin-right: 5px; cursor: pointer; }
        .msg-send { color: blue; }
        .msg-recv { color: green; }
    </style>
</head>
<body>

    <h2>VisionAid WebSocket Tester</h2>
    
    <div>
        <strong>Status:</strong> <span id="status" style="color: red;">Disconnected</span>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div class="controls">
        <h3>Send Commands (New Format):</h3>
        <button onclick="sendCmd({type: 'find_object', payload: {object_name: 'chair'}})">Find Chair</button>
        <button onclick="sendCmd({type: 'find_object', payload: {object_name: 'person'}})">Find Person</button>
        <button onclick="sendCmd({type: 'describe_scene'})">Describe Front</button>
        <button onclick="sendCmd({type: 'SIMULATE_OBSTACLE'})">Simulate ToF Obstacle</button>
        <button onclick="sendCmd({type: 'request_telemetry'})">Request Telemetry</button>
        <button onclick="sendCmd({type: 'pause_vision'})">Pause Vision AI</button>
        <button onclick="sendCmd({type: 'resume_vision'})">Resume Vision AI</button>
        <button onclick="sendCmd({type: 'stop'})">Stop (IDLE Mode)</button>
    </div>

    <h3>Logs:</h3>
    <div id="log"></div>

    <script>
        let ws = null;
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function log(msg, type) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type) div.className = type;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function connect() {
            if (ws) {
                ws.close();
            }
            ws = new WebSocket('ws://localhost:8765');
            
            ws.onopen = () => {
                statusEl.textContent = 'Connected';
                statusEl.style.color = 'green';
                log('Connected to server');
            };
            
            ws.onmessage = (e) => {
                log('Received: ' + e.data, 'msg-recv');
            };
            
            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                statusEl.style.color = 'red';
                log('Disconnected from server');
            };
            
            ws.onerror = (err) => {
                log('Error: connection failed. Ensure pi_inference.py is running.');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function sendCmd(obj) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Not connected to server!');
                return;
            }
            const str = JSON.stringify(obj);
            ws.send(str);
            log('Sent: ' + str, 'msg-send');
        }
    </script>
</body>
</html>
